<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>绿色气泡修改器</title><style>
*{box-sizing:border-box}body{margin:0;background:#ededed;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#111}.wrap{max-width:680px;margin:auto;padding:18px}.preview{padding:24px 28px 28px 12px;display:flex;justify-content:flex-end}.bubble{position:relative;max-width:86%;background:#95ec69;border-radius:7px;padding:12px 14px;font-size:19px;line-height:1.45;white-space:pre-wrap;word-break:break-word}.bubble:after{content:"";position:absolute;right:-10px;top:16px;border-top:8px solid transparent;border-bottom:8px solid transparent;border-left:11px solid #95ec69}.panel{background:#fff;border-radius:14px;padding:16px}label{display:block;font-weight:600;margin-bottom:8px}textarea{width:100%;min-height:130px;border:1px solid #ddd;border-radius:10px;padding:12px;font-size:18px;line-height:1.5;resize:vertical}button{width:100%;margin-top:12px;border:0;border-radius:10px;padding:14px;background:#07c160;color:#fff;font-size:17px;font-weight:600}.tip{margin-top:12px;color:#666;font-size:14px;line-height:1.55}</style></head><body><div class="wrap"><div class="preview"><div id="preview" class="bubble">卡片封面</div></div><div class="panel"><label for="text">气泡文字</label><textarea id="text">卡片封面</textarea><button id="save">保存修改</button><div class="tip">保存后，同一网站域名下已打开的展示页会读取最新文字；无需重新生成展示页。</div></div></div><script>
const KEY='greenCardText',t=document.getElementById('text'),p=document.getElementById('preview'),b=document.getElementById('save');
try{t.value=localStorage.getItem(KEY)||'卡片封面'}catch(e){} p.textContent=t.value;
t.oninput=()=>p.textContent=t.value||' ';
b.onclick=()=>{try{localStorage.setItem(KEY,t.value||' ');localStorage.setItem(KEY+'Updated',Date.now().toString());b.textContent='已保存';setTimeout(()=>b.textContent='保存修改',1200)}catch(e){alert('保存失败')}};
</script></body></html>
