<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>卡片封面</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.stage{width:100%;padding:12px 24px 12px 12px}
.bubble{
  --green:#95ec69;
  position:relative;
  display:block;
  width:100%;
  min-height:112px;
  padding:25px 38px;
  background:var(--green);
  border-radius:16px;
  color:#111;
  font-size:34px;
  line-height:1.35;
  font-weight:400;
  white-space:pre-wrap;
  word-break:break-word;
}
.bubble::after{
  content:"";
  position:absolute;
  right:-17px;
  top:50%;
  transform:translateY(-50%);
  width:0;height:0;
  border-top:15px solid transparent;
  border-bottom:15px solid transparent;
  border-left:19px solid var(--green);
}
@media(max-width:520px){
 .stage{padding:8px 20px 8px 8px}
 .bubble{min-height:88px;padding:19px 26px;border-radius:12px;font-size:27px}
 .bubble::after{right:-13px;border-top-width:11px;border-bottom-width:11px;border-left-width:15px}
}
</style>
</head>
<body>
<div class="stage"><div id="bubble" class="bubble">卡片封面</div></div>
<script>
function render(){
 let text="卡片封面";
 try{text=localStorage.getItem("greenCardText")||text}catch(e){}
 document.getElementById("bubble").textContent=text;
}
render();
window.addEventListener("storage",render);
</script>
</body>
</html>
