<body>
<div class="wrap">
  <div class="panel">
    <div class="preview">
      <div id="pvBubble" class="bubble"></div>
      <img id="pvAvatar" class="avatar" alt="头像">
    </div>

    <label for="txt">气泡文字</label>
    <textarea id="txt" maxlength="100"></textarea>

    <label>文字颜色</label>
    <div class="row">
      <input id="textColor" type="color">
      <input id="textColorHex" type="text" maxlength="7">
    </div>

    <label>气泡颜色</label>
    <div class="row">
      <input id="bubbleColor" type="color">
      <input id="bubbleColorHex" type="text" maxlength="7">
    </div>

    <label>头像</label>
    <div class="btns">
      <label class="filebtn">更换头像<input id="avatarFile" type="file" accept="image/*"></label>
      <button id="removeAvatar" class="danger" type="button">删除头像</button>
    </div>

    <div class="btns">
      <button id="save" type="button">保存修改</button>
      <button id="reset" class="secondary" type="button">恢复默认</button>
    </div>
    <div class="note">保存后，index.html 会读取相同浏览器中的最新内容。若部署到 GitHub Pages，两个文件和 12664.jpg 放在同一目录。</div>
  </div>
</div>

<script>
const defaults={
  text:"鸡兔猪牛虎\n退咯无咯测\n可怜啦啦啦",
  bubbleColor:"#95ec69",
  textColor:"#000000",
  avatar:""
};
let data;
try{data={...defaults,...JSON.parse(localStorage.getItem("coverBubbleData")||"{}")}}catch(e){data={...defaults}}

const $=id=>document.getElementById(id);
const txt=$("txt"), tc=$("textColor"), tch=$("textColorHex"), bc=$("bubbleColor"), bch=$("bubbleColorHex");
const pb=$("pvBubble"), pa=$("pvAvatar");

txt.value=data.text; tc.value=data.textColor; tch.value=data.textColor; bc.value=data.bubbleColor; bch.value=data.bubbleColor;

function validHex(v){ return /^#[0-9a-fA-F]{6}$/.test(v); }
function preview(){
  pb.textContent=txt.value;
  pb.style.color=tc.value;
  pb.style.background=bc.value;
  let s=document.getElementById("dynamicTail");
  if(!s){s=document.createElement("style");s.id="dynamicTail";document.head.appendChild(s)}
  s.textContent=`.bubble:after{border-left-color:${bc.value}!important}`;
  if(data.avatar){pa.src=data.avatar;pa.style.display="block"}else{pa.style.display="none"}
}
txt.addEventListener("input",preview);
tc.addEventListener("input",()=>{tch.value=tc.value;preview()});
bc.addEventListener("input",()=>{bch.value=bc.value;preview()});
tch.addEventListener("input",()=>{if(validHex(tch.value)){tc.value=tch.value;preview()}});
bch.addEventListener("input",()=>{if(validHex(bch.value)){bc.value=bch.value;preview()}});

$("avatarFile").addEventListener("change",e=>{
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{data.avatar=r.result;preview()};
  r.readAsDataURL(f);
});
$("removeAvatar").addEventListener("click",()=>{data.avatar="";preview()});

$("save").addEventListener("click",()=>{
  data.text=txt.value;
  data.textColor=tc.value;
  data.bubbleColor=bc.value;
  localStorage.setItem("coverBubbleData",JSON.stringify(data));
  alert("已保存");
});
$("reset").addEventListener("click",()=>{
  data={...defaults};
  txt.value=data.text;tc.value=data.textColor;tch.value=data.textColor;bc.value=data.bubbleColor;bch.value=data.bubbleColor;
  localStorage.setItem("coverBubbleData",JSON.stringify(data));
  preview();
});
preview();
</script>
</body>
</html>
