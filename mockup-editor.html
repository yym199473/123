<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>气泡图片实时修改器</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f4f4;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#111}
.wrap{max-width:820px;margin:auto;padding:14px}
.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 2px 10px #0001}
canvas{display:block;width:100%;height:auto;background:#eee;border-radius:12px;touch-action:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.full{grid-column:1/-1}
label{font-size:14px;color:#555;display:block;margin-bottom:5px}
textarea,input[type="range"],input[type="color"],input[type="file"]{width:100%}
textarea{min-height:88px;border:1px solid #ddd;border-radius:10px;padding:10px;font-size:16px}
input[type="range"]{accent-color:#07c160}
.row{display:flex;gap:10px}
button{flex:1;border:0;border-radius:10px;padding:12px 14px;font-size:16px;background:#07c160;color:white}
button.secondary{background:#444}
.note{font-size:13px;color:#777;margin-top:10px;line-height:1.5}
@media(max-width:560px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <canvas id="c" width="1080" height="720"></canvas>

    <div class="grid">
      <div class="full">
        <label>上传背景图片（可选）</label>
        <input id="bgFile" type="file" accept="image/*">
      </div>

      <div class="full">
        <label>气泡文字</label>
        <textarea id="text">卡片封面</textarea>
      </div>

      <div>
        <label>字体大小</label>
        <input id="fontSize" type="range" min="24" max="120" value="62">
      </div>
      <div>
        <label>气泡宽度</label>
        <input id="bubbleWidth" type="range" min="260" max="900" value="650">
      </div>

      <div>
        <label>气泡颜色</label>
        <input id="bubbleColor" type="color" value="#95ec69">
      </div>
      <div>
        <label>文字颜色</label>
        <input id="textColor" type="color" value="#111111">
      </div>

      <div>
        <label>横向位置</label>
        <input id="x" type="range" min="20" max="1000" value="220">
      </div>
      <div>
        <label>纵向位置</label>
        <input id="y" type="range" min="20" max="650" value="260">
      </div>

      <div class="full row">
        <button id="save">导出PNG</button>
        <button class="secondary" id="reset">恢复默认</button>
      </div>
    </div>

    <div class="note">这是一个图片/界面示意图编辑器：文字、颜色、尺寸、位置都会实时变化。也可以直接拖动绿色气泡。导出的图片仅是示意图，不会修改真实微信消息。</div>
  </div>
</div>

<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');

const textEl = document.getElementById('text');
const fontSizeEl = document.getElementById('fontSize');
const bubbleWidthEl = document.getElementById('bubbleWidth');
const bubbleColorEl = document.getElementById('bubbleColor');
const textColorEl = document.getElementById('textColor');
const xEl = document.getElementById('x');
const yEl = document.getElementById('y');
const bgFile = document.getElementById('bgFile');

let bg = null;
let dragging = false;
let dragDX = 0, dragDY = 0;

function roundedRect(ctx,x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function wrapText(text,maxWidth,fontSize){
  ctx.font = `400 ${fontSize}px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif`;
  const paras = String(text).split('\n');
  const lines=[];
  for(const para of paras){
    if(!para){lines.push('');continue}
    let line='';
    for(const ch of para){
      const test=line+ch;
      if(ctx.measureText(test).width>maxWidth && line){
        lines.push(line); line=ch;
      }else line=test;
    }
    lines.push(line);
  }
  return lines;
}

function draw(){
  ctx.clearRect(0,0,c.width,c.height);
  if(bg){
    const scale = Math.max(c.width/bg.width, c.height/bg.height);
    const w=bg.width*scale, h=bg.height*scale;
    ctx.drawImage(bg,(c.width-w)/2,(c.height-h)/2,w,h);
  }else{
    ctx.fillStyle='#ffffff';
    ctx.fillRect(0,0,c.width,c.height);
  }

  const x=+xEl.value, y=+yEl.value;
  const w=+bubbleWidthEl.value;
  const fs=+fontSizeEl.value;
  const padX=42, padY=28;
  const lines=wrapText(textEl.value, w-padX*2-30, fs);
  const lineH=fs*1.35;
  const h=Math.max(120, lines.length*lineH + padY*2);

  ctx.fillStyle=bubbleColorEl.value;
  roundedRect(ctx,x,y,w,h,24);
  ctx.fill();

  // tail
  ctx.beginPath();
  ctx.moveTo(x+w-2,y+h*0.42);
  ctx.lineTo(x+w+34,y+h*0.5);
  ctx.lineTo(x+w-2,y+h*0.58);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle=textColorEl.value;
  ctx.textBaseline='top';
  ctx.font=`400 ${fs}px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif`;
  let ty=y+padY;
  for(const line of lines){
    ctx.fillText(line,x+padX,ty);
    ty+=lineH;
  }

  // small mockup marker
  ctx.save();
  ctx.globalAlpha=.45;
  ctx.fillStyle='#666';
  ctx.font='24px sans-serif';
  ctx.fillText('示意图',24,c.height-42);
  ctx.restore();
}

for(const el of [textEl,fontSizeEl,bubbleWidthEl,bubbleColorEl,textColorEl,xEl,yEl]){
  el.addEventListener('input',draw);
}

bgFile.addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f)return;
  const img=new Image();
  img.onload=()=>{bg=img;draw()};
  img.src=URL.createObjectURL(f);
});

function point(ev){
  const r=c.getBoundingClientRect();
  const t=ev.touches?ev.touches[0]:ev;
  return {x:(t.clientX-r.left)*c.width/r.width,y:(t.clientY-r.top)*c.height/r.height};
}
function hit(px,py){
  const x=+xEl.value,y=+yEl.value,w=+bubbleWidthEl.value;
  const fs=+fontSizeEl.value;
  const lines=wrapText(textEl.value,w-84-30,fs);
  const h=Math.max(120,lines.length*fs*1.35+56);
  return px>=x && px<=x+w+36 && py>=y && py<=y+h;
}
function start(ev){
  const p=point(ev);
  if(hit(p.x,p.y)){
    dragging=true;
    dragDX=p.x-(+xEl.value);
    dragDY=p.y-(+yEl.value);
    ev.preventDefault();
  }
}
function move(ev){
  if(!dragging)return;
  const p=point(ev);
  xEl.value=Math.max(0,Math.min(c.width-100,p.x-dragDX));
  yEl.value=Math.max(0,Math.min(c.height-80,p.y-dragDY));
  draw(); ev.preventDefault();
}
function end(){dragging=false}
c.addEventListener('mousedown',start); window.addEventListener('mousemove',move); window.addEventListener('mouseup',end);
c.addEventListener('touchstart',start,{passive:false}); window.addEventListener('touchmove',move,{passive:false}); window.addEventListener('touchend',end);

document.getElementById('save').onclick=()=>{
  draw();
  const a=document.createElement('a');
  a.download='气泡示意图.png';
  a.href=c.toDataURL('image/png');
  a.click();
};
document.getElementById('reset').onclick=()=>{
  textEl.value='卡片封面';
  fontSizeEl.value=62; bubbleWidthEl.value=650;
  bubbleColorEl.value='#95ec69'; textColorEl.value='#111111';
  xEl.value=220; yEl.value=260; bg=null; bgFile.value='';
  draw();
};

draw();
</script>
</body>
</html>
