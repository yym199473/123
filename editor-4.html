<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>卡片封面修改器</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#111}
.wrap{max-width:680px;margin:auto;padding:14px}
.preview{padding:20px 25px 20px 8px}
.bubble{--green:#95ec69;position:relative;width:100%;min-height:100px;padding:22px 32px;background:var(--green);border-radius:14px;font-size:30px;line-height:1.35;white-space:pre-wrap;word-break:break-word}
.bubble:after{content:"";position:absolute;right:-16px;top:50%;transform:translateY(-50%);border-top:14px solid transparent;border-bottom:14px solid transparent;border-left:18px solid var(--green)}
.panel{background:#fff;border-radius:14px;padding:15px}
label{display:block;font-size:16px;font-weight:600;margin-bottom:8px}
textarea{width:100%;min-height:110px;padding:12px;border:1px solid #ddd;border-radius:10px;font:17px inherit;resize:vertical}
button{width:100%;border:0;border-radius:10px;padding:13px;margin-top:12px;background:#07c160;color:#fff;font-size:17px}
.note{margin-top:10px;color:#777;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
 <div class="preview"><div id="preview" class="bubble"></div></div>
 <div class="panel">
   <label>修改卡片文字</label>
   <textarea id="text" maxlength="120"></textarea>
   <button id="save">保存修改</button>
   <div class="note">公开页只显示绿色气泡和文字，不显示时间、头像，也没有点开内容。</div>
 </div>
</div>
<script>
const t=document.getElementById("text"),p=document.getElementById("preview");
let v="卡片封面";try{v=localStorage.getItem("greenCardText")||v}catch(e){}
t.value=v;p.textContent=v;
t.oninput=()=>p.textContent=t.value;
document.getElementById("save").onclick=()=>{
 try{localStorage.setItem("greenCardText",t.value)}catch(e){}
 alert("已保存");
};
</script>
</body>
</html>
