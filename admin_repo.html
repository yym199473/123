<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>数字管理</title>
<style>
body{margin:0;background:#f4f4f4;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#111}
.box{max-width:520px;margin:36px auto;padding:18px}
.card{background:white;border-radius:16px;padding:18px;box-shadow:0 6px 24px rgba(0,0,0,.08)}
h2{margin:0 0 14px;font-size:20px}
label{display:block;font-size:13px;color:#666;margin:12px 0 6px}
input{width:100%;padding:13px 12px;border:1px solid #ddd;border-radius:10px;font-size:17px;box-sizing:border-box}
button{width:100%;margin-top:14px;padding:13px;border:0;border-radius:10px;background:#111;color:white;font-size:16px}
.msg{font-size:13px;margin-top:12px;min-height:20px;color:#555;white-space:pre-wrap}
small{display:block;color:#888;line-height:1.6;margin-top:12px}
</style>
</head>
<body>
<div class="box"><div class="card">
<h2>修改图片数字</h2>
<label>数字</label>
<input id="numbers" value="2 4 11 12 22 24" inputmode="numeric">
<label>GitHub Token（只保存在当前浏览器会话，不写进网页）</label>
<input id="token" type="password" autocomplete="off" placeholder="github_pat_...">
<button id="save">保存并发布</button>
<div class="msg" id="msg"></div>
<small>只有拥有这个仓库写权限的 GitHub Token 才能保存。公开页面没有修改按钮，也不会保存你的 Token。</small>
</div></div>
<script>
const owner='yym199473', repo='123', path='data.json', branch='main';
const n=document.getElementById('numbers');
const t=document.getElementById('token');
const msg=document.getElementById('msg');
t.value=sessionStorage.getItem('gh-token')||'';

async function loadCurrent(){
  try{
    const r=await fetch('./data.json?t='+Date.now(),{cache:'no-store'});
    const d=await r.json();
    if(d.numbers) n.value=d.numbers;
  }catch(e){}
}
loadCurrent();

document.getElementById('save').onclick=async()=>{
  const token=t.value.trim();
  const numbers=n.value.trim().replace(/\s+/g,' ');
  if(!token){msg.textContent='请先输入 GitHub Token';return}
  if(!/^\d+( \d+)*$/.test(numbers)){msg.textContent='数字格式示例：2 4 11 12 22 24';return}
  sessionStorage.setItem('gh-token',token);
  msg.textContent='正在保存…';
  try{
    const api=`https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
    const h={'Accept':'application/vnd.github+json','Authorization':'Bearer '+token,'X-GitHub-Api-Version':'2022-11-28'};
    const get=await fetch(api+'?ref='+branch,{headers:h,cache:'no-store'});
    if(!get.ok) throw new Error('读取失败 '+get.status);
    const old=await get.json();
    const body=JSON.stringify({numbers,updatedAt:new Date().toISOString()},null,2)+'\n';
    const encoded=btoa(unescape(encodeURIComponent(body)));
    const put=await fetch(api,{method:'PUT',headers:{...h,'Content-Type':'application/json'},body:JSON.stringify({
      message:'Update displayed numbers',
      content:encoded,
      sha:old.sha,
      branch
    })});
    if(!put.ok){
      const e=await put.text();
      throw new Error('保存失败 '+put.status+' '+e.slice(0,160));
    }
    msg.textContent='保存成功。公开页通常会在几秒到几十秒内更新。';
  }catch(e){msg.textContent=String(e.message||e)}
};
</script>
</body>
</html>
