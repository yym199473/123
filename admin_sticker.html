<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>表情文字管理</title>
<style>
body{margin:0;background:#f4f4f4;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.box{max-width:520px;margin:28px auto;padding:16px}.card{background:#fff;padding:18px;border-radius:16px;box-shadow:0 5px 24px rgba(0,0,0,.08)}
h2{margin:0 0 14px;font-size:20px}label{display:block;font-size:13px;color:#666;margin:12px 0 6px}
textarea,input{width:100%;box-sizing:border-box;border:1px solid #ddd;border-radius:10px;padding:12px;font-size:16px}
textarea{min-height:92px;resize:vertical}
button{width:100%;margin-top:14px;padding:13px;border:0;border-radius:10px;background:#111;color:#fff;font-size:16px}
.msg{margin-top:10px;color:#666;font-size:13px;white-space:pre-wrap}
</style>
</head>
<body><div class="box"><div class="card">
<h2>修改动态表情文字</h2>
<label>显示文字</label>
<textarea id="text" placeholder="例如：今天顺顺利利"></textarea>
<label>GitHub Token</label>
<input id="token" type="password" placeholder="github_pat_..." autocomplete="off">
<button id="save">保存并发布</button>
<div class="msg" id="msg"></div>
</div></div>
<script>
const owner='yym199473',repo='123',path='data.json',branch='main';
const t=document.getElementById('text'),token=document.getElementById('token'),msg=document.getElementById('msg');
token.value=sessionStorage.getItem('gh-token')||'';
async function load(){try{const r=await fetch('./data.json?t='+Date.now(),{cache:'no-store'});const d=await r.json();t.value=d.text||''}catch(e){}}
load();
document.getElementById('save').onclick=async()=>{
 const tk=token.value.trim(); if(!tk){msg.textContent='请先输入 GitHub Token';return}
 sessionStorage.setItem('gh-token',tk); msg.textContent='正在保存…';
 try{
  const api=`https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
  const h={'Accept':'application/vnd.github+json','Authorization':'Bearer '+tk,'X-GitHub-Api-Version':'2022-11-28'};
  const g=await fetch(api+'?ref='+branch,{headers:h,cache:'no-store'}); if(!g.ok) throw new Error('读取失败 '+g.status);
  const old=await g.json();
  let current={}; try{current=JSON.parse(decodeURIComponent(escape(atob(old.content.replace(/\n/g,'')))))}catch(e){}
  current.text=t.value; current.updatedAt=new Date().toISOString();
  const body=JSON.stringify(current,null,2)+'\n';
  const encoded=btoa(unescape(encodeURIComponent(body)));
  const p=await fetch(api,{method:'PUT',headers:{...h,'Content-Type':'application/json'},body:JSON.stringify({message:'Update sticker text',content:encoded,sha:old.sha,branch})});
  if(!p.ok) throw new Error('保存失败 '+p.status);
  msg.textContent='保存成功，公开页几秒后更新。';
 }catch(e){msg.textContent=String(e.message||e)}
};
</script>
</body>
</html>
