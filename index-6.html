<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>气泡卡片</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden}
.bubble{
 position:relative;
 display:flex;align-items:center;justify-content:center;
 width:min(92vw,760px);
 min-height:150px;
 padding:28px 55px 28px 40px;
 background:#95ec69;
 border-radius:22px;
 color:#111;
 font-size:clamp(30px,7vw,64px);
 line-height:1.25;
 text-align:center;
 white-space:pre-wrap;
 word-break:break-word;
}
.bubble:after{
 content:"";position:absolute;right:-25px;top:50%;transform:translateY(-50%);
 width:0;height:0;border-top:22px solid transparent;border-bottom:22px solid transparent;border-left:27px solid #95ec69;
}
</style>
</head>
<body>
<div class="bubble" id="bubble">卡片封面</div>
<script>
function load(){
 let text="卡片封面";
 try{ text=localStorage.getItem("bubbleCardText") || text }catch(e){}
 document.getElementById("bubble").textContent=text;
}
load();
window.addEventListener("storage",load);
</script>
</body>
</html>
