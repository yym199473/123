<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>卡片封面</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:transparent}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.stage{width:100%;padding:8px 20px 8px 8px;display:flex;justify-content:flex-end}.bubble{--green:#95ec69;position:relative;display:inline-block;max-width:86%;min-height:44px;padding:10px 14px;background:var(--green);border-radius:7px;color:#111;font-size:18px;line-height:1.45;font-weight:400;white-space:pre-wrap;word-break:break-word}.bubble::after{content:"";position:absolute;right:-10px;top:16px;width:0;height:0;border-top:8px solid transparent;border-bottom:8px solid transparent;border-left:11px solid var(--green)}</style></head><body><div class="stage"><div id="bubble" class="bubble">卡片封面</div></div><script>
const KEY='greenCardText',el=document.getElementById('bubble');function render(){let text='卡片封面';try{text=localStorage.getItem(KEY)||text}catch(e){}el.textContent=text}render();window.addEventListener('storage',render);setInterval(render,1000);
</script></body></html>
