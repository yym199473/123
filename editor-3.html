<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>气泡卡片修改器</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#111}
.wrap{max-width:700px;margin:auto;padding:18px}
.preview{display:flex;align-items:center;justify-content:center;min-height:260px}
.bubble{position:relative;display:flex;align-items:center;justify-content:center;width:90%;min-height:130px;padding:25px 50px 25px 35px;background:#95ec69;border-radius:20px;font-size:clamp(28px,7vw,54px);line-height:1.25;text-align:center;white-space:pre-wrap;word-break:break-word}
.bubble:after{content:"";position:absolute;right:-22px;top:50%;transform:translateY(-50%);width:0;height:0;border-top:19px solid transparent;border-bottom:19px solid transparent;border-left:24px solid #95ec69}
.panel{background:white;border-radius:16px;padding:16px}
label{display:block;font-weight:600;margin-bottom:8px}
textarea{width:100%;min-height:120px;border:1px solid #ddd;border-radius:12px;padding:12px;font-size:18px;resize:vertical}
button{width:100%;margin-top:12px;border:0;border-radius:12px;padding:13px;background:#07c160;color:white;font-size:17px;font-weight:600}
.note{font-size:13px;color:#777;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
 <div class="preview"><div class="bubble" id="preview"></div></div>
 <div class="panel">
  <label for="text">修改气泡文字</label>
  <textarea id="text" maxlength="100"></textarea>
  <button id="save">保存</button>
  <div class="note">只修改绿色气泡文字；没有头像、背景图和点开后的内容。</div>
 </div>
</div>
<script>
const input=document.getElementById("text"), preview=document.getElementById("preview");
let v="卡片封面"; try{v=localStorage.getItem("bubbleCardText")||v}catch(e){}
input.value=v; preview.textContent=v;
input.addEventListener("input",()=>preview.textContent=input.value);
document.getElementById("save").onclick=()=>{
 try{localStorage.setItem("bubbleCardText",input.value)}catch(e){}
 alert("已保存");
};
</script>
</body>
</html>
